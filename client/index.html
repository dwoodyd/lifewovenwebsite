    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Cormorant Garamond (display serif) + DM Sans (body) -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Unregister any stale service workers (e.g. from a previous PWA deployment at this domain) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) { r.unregister(); }
        });
        // Also clear all caches so the old app shell doesn't serve stale assets
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) { caches.delete(name); }
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics: re-enable once VITE_ANALYTICS_ENDPOINT and VITE_ANALYTICS_WEBSITE_ID are defined in the build env. -->
  </body>
</html>
